<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoteSoFast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; background: #f4f4f1; overflow: hidden; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  button {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 2;
    font: 13px system-ui, -apple-system, sans-serif; color: #232321; background: rgba(244, 244, 241, 0.92);
    border: 1px solid rgba(35, 35, 33, 0.25); border-radius: 999px; padding: 6px 16px; cursor: pointer;
  }
  button:hover { border-color: #232321; }
</style>
</head>
<body>
<canvas id="c" aria-label="NoteSoFast: a living ASCII drawing of neurons around the wordmark"></canvas>
<button id="replay" type="button">Replay</button>
<script>
/*
 * Computer meets neuron.
 *
 * Each frame the network is drawn as a soft ink illustration on a hidden canvas
 * (organic somas, long tapering branched dendrites, beaded axons, glowing
 * signals), then converted to characters by brightness, the way ASCII art is
 * made from an image. Signals are drawn on a second layer and printed in the
 * accent colour.
 */
(function () {
  const INK = '#232321', GREY = '#a6a69e', ACC = '#3e6474', BG = '#f4f4f1';
  const RAMP = " .,:;i1tfLCG08@";            // light -> dark
  const SS = 2;                               // supersampling per cell
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const art = document.createElement('canvas'), actx = art.getContext('2d', { willReadFrequently: true });
  const sig = document.createElement('canvas'), sctx = sig.getContext('2d', { willReadFrequently: true });
  let W, H, CW, CH, COLS, ROWS, FS, neurons, axons, word, start;

  let seed = 7;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3));

  function layout() {
    seed = 7;
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    FS = W < 700 ? 7 : 8;
    CW = FS * 0.6; CH = FS * 1.12;
    COLS = Math.ceil(W / CW); ROWS = Math.ceil(H / CH);
    art.width = sig.width = COLS * SS; art.height = sig.height = ROWS * SS;

    const ws = Math.max(44, Math.min(118, W * 0.082));
    ctx.font = '500 ' + ws + 'px Newsreader, Georgia, serif';
    const ww = ctx.measureText('NoteSoFast').width;
    word = { size: ws, w: ww, x: W / 2 - ww / 2, y: H / 2 + ws * 0.32, rx: ww / 2 + ws * 0.7, ry: ws * 1.0 };

    // neurons scattered over the whole screen, outside the wordmark's clearing
    neurons = [];
    const minD = Math.max(170, Math.sqrt(W * H / 14));
    for (let k = 0; k < 8000 && neurons.length < 30; k++) {
      const x = rnd() * W, y = rnd() * H;
      const ex = (x - W / 2) / (word.rx + 40), ey = (y - H / 2) / (word.ry + 40);
      if (ex * ex + ey * ey < 1) continue;
      if (neurons.every((n) => Math.hypot(n.x - x, n.y - y) > minD)) neurons.push({ x, y });
    }
    const maxd = Math.max(...neurons.map((n) => Math.hypot(n.x - W / 2, n.y - H / 2)));
    neurons.forEach((n) => {
      n.s = 0.35 + rnd() * 0.65;                       // strength
      n.r = 18 + rnd() * 12 + 9 * n.s;
      n.t = 150 + 1300 * Math.hypot(n.x - W / 2, n.y - H / 2) / maxd + rnd() * 250;
      n.phase = rnd() * 6.28;
      n.lobes = [rnd(), rnd(), rnd(), rnd()].map((v) => v * 6.28);
      n.branches = [];
      const k = 3 + Math.floor(rnd() * 2 + 2 * n.s);
      for (let q = 0; q < k; q++) {
        const a = (q / k) * 6.283 + (rnd() - 0.5) * 0.7;
        grow(n.branches, n.x + Math.cos(a) * n.r * 0.8, n.y + Math.sin(a) * n.r * 0.8, a,
             n.r * (1.8 + rnd() * 1.6) * (0.65 + 0.5 * n.s), n.r * 0.32, 0, n.t + 250);
      }
    });

    // axons: long, gently curved links to near neighbours, carrying signals
    axons = [];
    const seen = new Set();
    neurons.forEach((a, i) => {
      neurons.map((b, j) => [j, Math.hypot(b.x - a.x, b.y - a.y)]).sort((p, q) => p[1] - q[1]).slice(1, 3).forEach(([j, d]) => {
        const key = Math.min(i, j) + ':' + Math.max(i, j);
        if (seen.has(key) || d > minD * 2.3) return;
        const b = neurons[j];
        const bend = (rnd() - 0.5) * d * 0.35;
        const mx = (a.x + b.x) / 2 - (b.y - a.y) / d * bend, my = (a.y + b.y) / 2 + (b.x - a.x) / d * bend;
        for (let k = 0; k <= 24; k++) {                // don't cross the wordmark
          const u = k / 24, x = (1 - u) * (1 - u) * a.x + 2 * (1 - u) * u * mx + u * u * b.x;
          const y = (1 - u) * (1 - u) * a.y + 2 * (1 - u) * u * my + u * u * b.y;
          const ex = (x - W / 2) / word.rx, ey = (y - H / 2) / word.ry;
          if (ex * ex + ey * ey < 1) return;
        }
        seen.add(key);
        const s = (a.s + b.s) / 2;
        axons.push({ a, b, mx, my, s, t: Math.max(a.t, b.t) + 700, period: 3200 - 2000 * s + rnd() * 1600, off: rnd() * 5000, dir: rnd() < 0.5 });
      });
    });
    start = performance.now();
  }

  // recursive dendrite: curved, tapering, branching up to four levels
  function grow(out, x, y, ang, len, w, depth, t) {
    const bend = (rnd() - 0.5) * 0.9;
    const x1 = x + Math.cos(ang) * len, y1 = y + Math.sin(ang) * len;
    const cx = x + Math.cos(ang + bend * 0.5) * len * 0.55, cy = y + Math.sin(ang + bend * 0.5) * len * 0.55;
    const dur = 260 + len * 6;
    out.push({ x, y, cx, cy, x1, y1, w, t0: t, t1: t + dur });
    if (depth >= 3 || w < 0.6) return;
    const kids = depth === 0 ? 2 : (rnd() < 0.45 ? 2 : 1);
    const endAng = Math.atan2(y1 - cy, x1 - cx);
    for (let q = 0; q < kids; q++) {
      const spread = kids === 1 ? (rnd() - 0.5) * 0.6 : (q === 0 ? -1 : 1) * (0.35 + rnd() * 0.45);
      grow(out, x1, y1, endAng + spread, len * (0.6 + rnd() * 0.2), w * 0.6, depth + 1, t + dur * 0.85);
    }
  }

  function quadPoint(x0, y0, cx, cy, x1, y1, u) {
    return [(1 - u) * (1 - u) * x0 + 2 * (1 - u) * u * cx + u * u * x1, (1 - u) * (1 - u) * y0 + 2 * (1 - u) * u * cy + u * u * y1];
  }

  function drawArt(t) {
    // hidden canvases are in "cell space": 1 cell = SS pixels; we draw in screen px
    for (const c of [actx, sctx]) {
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.fillStyle = '#fff'; c.fillRect(0, 0, art.width, art.height);
      c.setTransform(SS / CW, 0, 0, SS / CH, 0, 0);
      c.lineCap = 'round'; c.lineJoin = 'round';
    }

    // faint paper grain so the whole screen breathes
    actx.fillStyle = 'rgba(0,0,0,0.05)';
    for (let k = 0; k < 90; k++) {
      const gx = ((k * 9301 + 49297) % 233280) / 233280 * W, gy = ((k * 49297 + 9301) % 233280) / 233280 * H;
      const tw = 0.5 + 0.5 * Math.sin(t * 0.0012 + k);
      actx.globalAlpha = tw; actx.fillRect(gx, gy, CW * 0.9, CH * 0.9);
    }
    actx.globalAlpha = 1;

    // axons: thin beaded curves
    axons.forEach((ax) => {
      const p = ease((t - ax.t) / 900);
      if (p <= 0) return;
      actx.strokeStyle = 'rgba(0,0,0,' + (0.35 + 0.45 * ax.s) + ')';
      actx.lineWidth = 1.1 + 1.1 * ax.s;
      actx.setLineDash([CW * 1.2, CW * 1.4]);
      actx.beginPath();
      const steps = 40;
      for (let k = 0; k <= steps * p; k++) {
        const [x, y] = quadPoint(ax.a.x, ax.a.y, ax.mx, ax.my, ax.b.x, ax.b.y, k / steps);
        k ? actx.lineTo(x, y) : actx.moveTo(x, y);
      }
      actx.stroke();
      actx.setLineDash([]);
      // signal: a glowing bead travelling the axon
      if (p >= 1) {
        const u = ((t + ax.off) % ax.period) / (ax.period * 0.6);
        if (u <= 1) {
          const [x, y] = quadPoint(ax.a.x, ax.a.y, ax.mx, ax.my, ax.b.x, ax.b.y, ax.dir ? u : 1 - u);
          const g = sctx.createRadialGradient(x, y, 0, x, y, 14);
          g.addColorStop(0, 'rgba(0,0,0,0.95)'); g.addColorStop(1, 'rgba(0,0,0,0)');
          sctx.fillStyle = g; sctx.fillRect(x - 14, y - 14, 28, 28);
        }
      }
    });

    // dendrites: grow out from the soma, tapering to fine tips
    neurons.forEach((n) => {
      n.branches.forEach((b) => {
        const p = ease((t - b.t0) / (b.t1 - b.t0));
        if (p <= 0) return;
        actx.strokeStyle = 'rgba(0,0,0,' + (0.6 + 0.35 * n.s) + ')';
        actx.lineWidth = Math.max(0.6, b.w);
        actx.beginPath();
        actx.moveTo(b.x, b.y);
        const steps = 12;
        for (let k = 1; k <= steps * p; k++) actx.lineTo(...quadPoint(b.x, b.y, b.cx, b.cy, b.x1, b.y1, k / steps));
        actx.stroke();
      });
    });

    // somas: organic bodies, breathing; dark nucleus; strong cells pulse
    neurons.forEach((n) => {
      const pop = ease((t - n.t) / 600);
      if (pop <= 0) return;
      const breathe = 1 + 0.06 * Math.sin(t * 0.0018 * (0.5 + n.s) + n.phase);
      const R = n.r * pop * breathe;
      actx.beginPath();
      for (let k = 0; k <= 48; k++) {
        const a = (k / 48) * 6.283;
        const wob = 1 + 0.16 * Math.sin(a * 2 + n.lobes[0]) + 0.1 * Math.sin(a * 3 + n.lobes[1]) + 0.06 * Math.sin(a * 5 + n.lobes[2]);
        const x = n.x + Math.cos(a) * R * wob, y = n.y + Math.sin(a) * R * wob;
        k ? actx.lineTo(x, y) : actx.moveTo(x, y);
      }
      const g = actx.createRadialGradient(n.x - R * 0.3, n.y - R * 0.3, R * 0.1, n.x, n.y, R * 1.25);
      g.addColorStop(0, 'rgba(0,0,0,0.35)'); g.addColorStop(0.7, 'rgba(0,0,0,0.75)'); g.addColorStop(1, 'rgba(0,0,0,0.95)');
      actx.fillStyle = g; actx.fill();
      // nucleus
      actx.beginPath();
      actx.arc(n.x + R * 0.08, n.y + R * 0.05, R * 0.34, 0, 6.283);
      actx.fillStyle = 'rgba(255,255,255,0.65)'; actx.fill();
      actx.beginPath();
      actx.arc(n.x + R * 0.1, n.y + R * 0.07, R * 0.17, 0, 6.283);
      actx.fillStyle = '#000'; actx.fill();
    });

    // clearing for the wordmark
    actx.save();
    actx.beginPath(); actx.ellipse(W / 2, H / 2, word.rx, word.ry, 0, 0, 6.283);
    const fade = actx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, word.rx);
    fade.addColorStop(0, '#fff'); fade.addColorStop(0.85, '#fff'); fade.addColorStop(1, 'rgba(255,255,255,0)');
    actx.fillStyle = fade; actx.fill();
    actx.restore();
  }

  function sample(c, w, h) {
    const d = c.getImageData(0, 0, w, h).data;
    const out = new Float32Array(COLS * ROWS);
    for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
      let sum = 0;
      for (let y = 0; y < SS; y++) for (let x = 0; x < SS; x++) sum += d[((r * SS + y) * w + col * SS + x) * 4];
      out[r * COLS + col] = 1 - sum / (SS * SS * 255);    // darkness 0..1
    }
    return out;
  }

  function frame(now) {
    const t = now - start;
    drawArt(t);
    const dark = sample(actx, art.width, art.height);
    const glow = sample(sctx, sig.width, sig.height);
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    ctx.font = FS + "px 'JetBrains Mono', ui-monospace, monospace";
    ctx.textBaseline = 'top';
    const n = RAMP.length - 1;
    for (let r = 0; r < ROWS; r++) {
      let strong = '', weak = '', accs = [];
      for (let c = 0; c < COLS; c++) {
        const v = dark[r * COLS + c], gl = glow[r * COLS + c];
        if (gl > 0.25) { accs.push([c, RAMP[Math.min(n, Math.round(gl * n))]]); strong += ' '; weak += ' '; continue; }
        if (v < 0.07) { strong += ' '; weak += ' '; continue; }
        const ch = RAMP[Math.max(1, Math.min(n, Math.round(Math.pow(v, 1.15) * n)))];
        if (v > 0.45) { strong += ch; weak += ' '; } else { weak += ch; strong += ' '; }
      }
      ctx.fillStyle = GREY; ctx.fillText(weak, 0, r * CH);
      ctx.fillStyle = INK; ctx.fillText(strong, 0, r * CH);
      if (accs.length) { ctx.fillStyle = ACC; accs.forEach(([c, ch]) => ctx.fillText(ch, c * CW, r * CH)); }
    }

    // the wordmark swipes in as the network forms
    const wp = ease((t - 900) / 1000);
    if (wp > 0) {
      ctx.save();
      ctx.beginPath(); ctx.rect(word.x - 20, word.y - word.size, (word.w + 40) * wp, word.size * 1.4); ctx.clip();
      ctx.globalAlpha = Math.min(1, wp * 1.5);
      ctx.fillStyle = INK; ctx.textBaseline = 'alphabetic';
      ctx.font = '500 ' + word.size + 'px Newsreader, Georgia, serif';
      ctx.fillText('NoteSoFast', word.x - (1 - wp) * 12, word.y);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }

  Promise.race([
    Promise.all([document.fonts.load('500 64px "Newsreader"'), document.fonts.load('8px "JetBrains Mono"')]),
    new Promise((r) => setTimeout(r, 2500)),
  ]).then(() => { layout(); requestAnimationFrame(frame); });
  addEventListener('resize', layout);
  document.getElementById('replay').addEventListener('click', () => { start = performance.now(); });
})();
</script>
</body>
</html>
