<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Outer octagon -->
  <polygon points="10.5 1 21.5 1 31 10.5 31 21.5 21.5 31 10.5 31 1 21.5 1 10.5" fill="#111111" stroke="#333333" stroke-width="0.5"/>
  <!-- Inner glow ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#e8e8e8" stroke-width="1.2" opacity="0.15"/>
  <!-- Center brain/node network icon -->
  <!-- Main hub -->
  <circle cx="16" cy="14" r="2.5" fill="#e8e8e8"/>
  <!-- Top-left node -->
  <circle cx="10" cy="10" r="1.8" fill="#34d399"/>
  <!-- Top-right node -->
  <circle cx="22" cy="10" r="1.8" fill="#fbbf24"/>
  <!-- Bottom-left node -->
  <circle cx="11" cy="21" r="1.8" fill="#60a5fa"/>
  <!-- Bottom-right node -->
  <circle cx="21" cy="20" r="1.8" fill="#f87171"/>
  <!-- Connecting lines -->
  <line x1="13.8" y1="12.5" x2="11.5" y2="11" stroke="#e8e8e8" stroke-width="0.8" opacity="0.5"/>
  <line x1="18.2" y1="12.5" x2="20.5" y2="11" stroke="#e8e8e8" stroke-width="0.8" opacity="0.5"/>
  <line x1="14.5" y1="15.8" x2="12" y2="19.5" stroke="#e8e8e8" stroke-width="0.8" opacity="0.5"/>
  <line x1="17.5" y1="15.8" x2="20" y2="18.5" stroke="#e8e8e8" stroke-width="0.8" opacity="0.5"/>
  <!-- Cross connections (subtle) -->
  <line x1="11.5" y1="11.5" x2="12" y2="19.5" stroke="#e8e8e8" stroke-width="0.4" opacity="0.25"/>
  <line x1="20.5" y1="11.5" x2="20" y2="18.5" stroke="#e8e8e8" stroke-width="0.4" opacity="0.25"/>
</svg>
